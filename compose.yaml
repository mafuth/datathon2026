services:
  mobilix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-MobiliX}
        PUBLIC_BASE_URL: ${DOCKER_PUBLIC_BASE_URL:-http://localhost:3000}
        PUBLIC_R2_BUCKET_NAME: ${PUBLIC_R2_BUCKET_NAME:-}
        PUBLIC_R2_BUCKET_URL: ${PUBLIC_R2_BUCKET_URL:-}
    image: mobilix:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/local.db
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      PUBLIC_BASE_URL: ${DOCKER_PUBLIC_BASE_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${DOCKER_PUBLIC_BASE_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      PUBLIC_R2_BUCKET_NAME: ${PUBLIC_R2_BUCKET_NAME:-}
      PUBLIC_R2_BUCKET_URL: ${PUBLIC_R2_BUCKET_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
    volumes:
      - ./local.db:/app/data/local.db:Z
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
