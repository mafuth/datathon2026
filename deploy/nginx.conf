# Existing snippet: /etc/nginx/snippets/datathon.conf inside the site's HTTPS block.
# Preserve /apps/datathon on upstream requests. No trailing slash on proxy_pass.
location = /apps/datathon {
    proxy_pass http://127.0.0.1:18730;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    client_max_body_size 16m;
}
location ^~ /apps/datathon/ {
    proxy_pass http://127.0.0.1:18730;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    client_max_body_size 16m;
}
