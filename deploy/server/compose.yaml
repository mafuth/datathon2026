name: datathon2026
services:
  mobilix:
    image: ${DATATHON_IMAGE:?Supply the immutable deployment image}
    user: '1000:1000'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./app.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: file:/app/data/runtime/local.db
      DATATHON_REVISION: ${DATATHON_REVISION:?Supply the deployed source revision}
      MOBILITY_API_DELAY_MS: '0'
      HEALTHCHECK_PATH: /apps/datathon/api/health
    ports: ['127.0.0.1:18730:3000']
    volumes:
      - ../data:/app/data/runtime
    tmpfs: ['/tmp:size=64m,mode=1777,noexec,nosuid']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/apps/datathon/api/health').then(async r=>{const d=await r.json();process.exit(r.ok&&d.status==='ok'&&d.revision===process.env.DATATHON_REVISION?0:1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [datathon2026]
networks:
  datathon2026:
    driver: bridge
